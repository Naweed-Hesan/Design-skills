<!-- @dsCard group="Spacing" viewport="760x150" subtitle="One coherent set. Panels round most, controls two thirds, media half." name="Corner radii" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corner radii</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">Components ask for a role, never a size, so switching the set in brand.css moves every corner together.</div>
<div class="g-row">
  <div><div style="width:96px;height:60px;border-radius:var(--radius-panel);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-label">panel</div><div class="g-hex">--radius-lg</div></div>
  <div><div style="width:96px;height:60px;border-radius:var(--radius-control);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-label">control</div><div class="g-hex">--radius-md</div></div>
  <div><div style="width:96px;height:60px;border-radius:var(--radius-media);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-label">media</div><div class="g-hex">--radius-sm</div></div>
  <div><div style="width:96px;height:60px;border-radius:var(--radius-inset);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-label">inset</div><div class="g-hex">--radius-xs</div></div>
  <div><div style="width:96px;height:60px;border-radius:var(--radius-pill);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-label">pill</div><div class="g-hex">--radius-pill</div></div>
</div>
</body></html>
