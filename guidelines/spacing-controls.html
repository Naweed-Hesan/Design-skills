<!-- @dsCard group="Spacing" viewport="760x130" subtitle="Three heights only, set by the density choice." name="Control heights" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control heights</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">Nothing in between. An interface with five button heights reads as five interfaces.</div>
<div class="g-row" style="align-items:flex-end">
  <div><button style="height:var(--control-sm);padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface-raised);color:var(--text-secondary);font:inherit;font-size:12px">Small</button><div class="g-hex">--control-sm</div></div>
  <div><button style="height:var(--control-md);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface-raised);color:var(--text-secondary);font:inherit;font-size:12.5px">Medium</button><div class="g-hex">--control-md</div></div>
  <div><button style="height:var(--control-lg);padding:0 18px;border:0;border-radius:var(--radius-control);background:var(--accent-solid);color:var(--text-on-accent);font:inherit;font-size:14px">Large</button><div class="g-hex">--control-lg</div></div>
</div>
</body></html>
