<!-- @dsCard group="Brand" viewport="760x150" subtitle="Soft, wide, low opacity. Elevation is never a border." name="Elevation" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">If you are thickening a border to separate two things, you want a surface change or a shadow.</div>
<div class="g-row" style="gap:16px">
  <div><div style="width:110px;height:62px;border-radius:var(--radius-panel);background:var(--surface-raised);box-shadow:var(--shadow-xs)"></div><div class="g-hex">--shadow-xs</div></div>
  <div><div style="width:110px;height:62px;border-radius:var(--radius-panel);background:var(--surface-raised);box-shadow:var(--shadow-sm)"></div><div class="g-hex">--shadow-sm</div></div>
  <div><div style="width:110px;height:62px;border-radius:var(--radius-panel);background:var(--surface-raised);box-shadow:var(--shadow-md)"></div><div class="g-hex">--shadow-md</div></div>
  <div><div style="width:110px;height:62px;border-radius:var(--radius-panel);background:var(--surface-raised);box-shadow:var(--shadow-lg)"></div><div class="g-hex">--shadow-lg</div></div>
  <div><div style="width:110px;height:62px;border-radius:var(--radius-panel);background:var(--surface-overlay);box-shadow:var(--shadow-popover)"></div><div class="g-hex">--shadow-popover</div></div>
</div>
</body></html>
