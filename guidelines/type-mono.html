<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono and numerals</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">Tabular figures, so a column does not shift width as the values change.</div>
<table style="border-collapse:collapse;font-size:12.5px">
  <thead><tr>
    <th style="text-align:left;padding:0 16px 8px 0;font-weight:400;font-size:11.5px;color:var(--text-tertiary)">File</th>
    <th style="text-align:right;padding:0 16px 8px 0;font-weight:400;font-size:11.5px;color:var(--text-tertiary)">Dimensions</th>
    <th style="text-align:right;padding:0 16px 8px 0;font-weight:400;font-size:11.5px;color:var(--text-tertiary)">Size</th>
    <th style="text-align:left;padding:0 0 8px;font-weight:400;font-size:11.5px;color:var(--text-tertiary)">Colour</th>
  </tr></thead>
  <tbody>
    <tr><td style="padding:5px 16px 5px 0">Lunar identity</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">736 × 575</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">412 kb</td><td class="ds-num">#0b8b8e</td></tr>
    <tr><td style="padding:5px 16px 5px 0">Poster study</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">736 × 920</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">1.1 mb</td><td class="ds-num">#3a5f7d</td></tr>
    <tr><td style="padding:5px 16px 5px 0">Editorial cover</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">736 × 1040</td><td class="ds-num" style="text-align:right;padding:5px 16px 5px 0">88 kb</td><td class="ds-num">#c08a2e</td></tr>
  </tbody>
</table>
<div class="g-note" style="margin-top:14px">Hex values and file formats read lowercase, because that is how they are stored.</div>
</body></html>
