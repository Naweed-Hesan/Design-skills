<!-- @dsCard group="Spacing" viewport="760x160" subtitle="4px base grid. Every gap is a step on it." name="Spacing scale" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">A gap that is not on this scale was eyeballed.</div>
<div style="display:flex;flex-direction:column;gap:5px">
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-1</span><span style="height:11px;width:4px;background:var(--accent);border-radius:2px"></span><span class="g-hex">4px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-2</span><span style="height:11px;width:8px;background:var(--accent);border-radius:2px"></span><span class="g-hex">8px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-3</span><span style="height:11px;width:12px;background:var(--accent);border-radius:2px"></span><span class="g-hex">12px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-4</span><span style="height:11px;width:16px;background:var(--accent);border-radius:2px"></span><span class="g-hex">16px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-6</span><span style="height:11px;width:24px;background:var(--accent);border-radius:2px"></span><span class="g-hex">24px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-7</span><span style="height:11px;width:32px;background:var(--accent);border-radius:2px"></span><span class="g-hex">32px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-9</span><span style="height:11px;width:48px;background:var(--accent);border-radius:2px"></span><span class="g-hex">48px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-10</span><span style="height:11px;width:64px;background:var(--accent);border-radius:2px"></span><span class="g-hex">64px</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="ds-num" style="width:70px;color:var(--text-tertiary)">--space-12</span><span style="height:11px;width:120px;background:var(--accent);border-radius:2px"></span><span class="g-hex">120px · marketing rhythm</span></div>
</div>
</body></html>
