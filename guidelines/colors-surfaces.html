<!-- @dsCard group="Colors" viewport="760x190" subtitle="Canvas behind, panels floating on it. Both themes." name="Surfaces" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surfaces</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="_specimen.css">
<script src="_specimen.js" defer></script>
</head>
<body>
<div class="g-note">The same six tokens, resolved in each theme. Swap tokens/brand.css and these update.</div>
<div class="g-section"><div class="g-h">Light</div><div id="light"></div></div>
<div class="g-section" data-theme="dark" style="padding:12px;border-radius:var(--radius-panel);background:var(--surface-canvas)">
  <div class="g-h">Dark</div><div id="dark"></div>
</div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var pairs = [['--surface-canvas','canvas'],['--surface-raised','raised'],['--surface-subtle','subtle'],
               ['--surface-sunk','sunk'],['--surface-overlay','overlay'],['--media-well','media well']];
  DSSpecimen.swatches('#light', pairs, 6);
  DSSpecimen.swatches('#dark', pairs, 6);
});
</script>
</body></html>
